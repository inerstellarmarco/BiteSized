name: Backup

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the database package
        run: npm run backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_EXTERNAL_DIR: ${{ runner.temp }}/bite-sized-backup
      - uses: actions/upload-artifact@v4
        with:
          name: bite-sized-backup
          path: ${{ runner.temp }}/bite-sized-backup
          retention-days: 30
